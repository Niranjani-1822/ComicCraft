<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f8;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎨 ComicCraft</h1>
        <p>AI Comic Story Creator using Gemini Models</p>
    </header>

    <div class="container">

        <h2>Create Your Comic</h2>

        <form action="/generate" method="post">

            <label for="theme">Story Theme</label>
            <input
                type="text"
                id="theme"
                name="theme"
                placeholder="Example: Space Adventure"
                required
            >

            <label for="character">Main Character</label>
            <input
                type="text"
                id="character"
                name="character"
                placeholder="Example: Maya"
                required
            >

            <label for="setting">Setting</label>
            <input
                type="text"
                id="setting"
                name="setting"
                placeholder="Example: A futuristic city"
                required
            >

            <label for="tone">Story Tone</label>
            <select id="tone" name="tone" required>
                <option value="">Select a tone</option>
                <option value="Funny">Funny</option>
                <option value="Adventure">Adventure</option>
                <option value="Mystery">Mystery</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Emotional">Emotional</option>
            </select>

            <label for="art_style">Preferred Art Style</label>
            <select id="art_style" name="art_style" required>
                <option value="">Select an art style</option>
                <option value="Comic Book">Comic Book</option>
                <option value="Anime">Anime</option>
                <option value="Cartoon">Cartoon</option>
                <option value="Manga">Manga</option>
                <option value="Digital Art">Digital Art</option>
            </select>

            <button type="submit">
                Generate My Comic
            </button>

        </form>

        <div class="info">
            <strong>How it works:</strong>
            <p>
                Enter your story details and ComicCraft will create
                a structured multi-panel comic story with scenes
                and character dialogues.
            </p>
        </div>

    </div>

    <footer>
        ComicCraft | AI-Powered Comic Story Creator
    </footer>

</body>
</html>
